<!--
  The same conversation as `messenger-thread.html`, with every Facebook message
  id removed.

  This is the case the composite fallback key exists for: no provider id means
  idempotency has to key on (thread, sender, seq, text), where `seq` is handed
  out once per genuinely new message rather than read off the DOM. The parser
  must still find exactly the same inbound messages and still exclude the
  Page's own reply.
-->
<div role="main">
  <div role="grid" aria-label="Messages in conversation with Budi Santoso">

    <!-- A date divider: real text, no sender, not a message. -->
    <div role="row"><span dir="auto">19 September 2026</span></div>

    <div role="row" aria-label="Message from Budi Santoso">
      <img alt="Budi Santoso" src="avatar.png" />
      <div dir="auto">Sis, ini masih ready?</div>
      <span data-utime="1789000000" dir="auto">14:26</span>
    </div>

    <!-- Grouped follow-up: Facebook labels the first bubble of a run and leaves
         the rest bare, so this one is attributed via the participant name. -->
    <div role="row">
      <div dir="auto">Yang warna hitam ada?</div>
      <span data-utime="1789000060" dir="auto">14:27</span>
    </div>

    <!-- The Page's own reply. Inbound-only: must never be ingested. -->
    <div role="row" aria-label="You sent">
      <div dir="auto">Halo kak, masih ada ya</div>
      <span data-utime="1789000120" dir="auto">14:28</span>
    </div>

    <!-- A multi-line message: the runs must be preserved, not glued together. -->
    <div role="row" aria-label="Message from Budi Santoso">
      <img alt="Budi Santoso" src="avatar.png" />
      <div dir="auto">Oke sip</div>
      <div dir="auto">Saya ambil 2</div>
      <span data-utime="1789000180" dir="auto">14:29</span>
    </div>

    <!-- A sticker: a real interaction, but no text to record. -->
    <div role="row" aria-label="Message from Budi Santoso">
      <img alt="Budi Santoso" src="avatar.png" />
    </div>

  </div>
</div>
